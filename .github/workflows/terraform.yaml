name: terraform deployment
on: 
  push:
jobs:
  Build:
    env:
      AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID}}"
      AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY}}"
    runs-on: self-hosted
    steps:
      - name: code checkout
        uses: actions/checkout@v4
      - name: setup terraform binaries
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.3
      - name: Terraform init
        run: terraform init
  validate:
    runs-on: Github-hosted
    steps:
      - name: code checkout
        uses: actions/checkout@v4
      - name: setup terraform binaries
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.3
      - name: 'Install TFLint'
          run: |
            curl -sLo tflint.zip https://github.com/terraform-linters/tflint/releases/download/v${{ env.TFLINT_VERSION }}/tflint_linux_amd64.zip
            unzip tflint.zip -d /usr/local/bin/
            tflint --version
      - name: 'Install tfsec'
        run: |
          curl -sLo tfsec https://github.com/aquasecurity/tfsec/releases/download/v${{ env.TFSEC_VERSION }}/tfsec-linux-amd64
          ch mod +x tfsec
          mv tfsec /usr/local/bin/
          tfsec --version    
      - name: Terraform format
        run: terraform fmt
      - name: Terraform validate
        run: terraform validate
      - name: 'TFLint'
        run: |
          tflint --init
          tflint
      - name: 'tfsec'
        run: tfsec .
  plan:
   runs-on: github-hosted
   needs: validate
   steps:
     - name: code checkout
       uses: actions/checkout@v4
     - name: setup terraform binaries
       uses: hashicorp/setup-terraform@v3
       with:
          terraform_version: 1.6.3
     - name: Terraform plan
       run: terraform plan -out=plan
  apply:
    runs-on: github-hosted
    steps:
     - name: code checkout
       uses: actions/checkout@v4
     - name: setup terraform binaries
       uses: hashicorp/setup-terraform@v3
       with:
          terraform_version: 1.6.3
     - name: Terraform apply plan
       run: terraform apply plan

        
  
